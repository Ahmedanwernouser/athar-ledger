# Which of the site's Gemini keys answer, and what limit a refusing one names (eval/keyprobe/run.mjs).
# Keys are repository secrets; never printed, never written: a key is named by its position. Results: branch `key-probe-results`.
name: key-probe
on:
  workflow_dispatch:
    inputs:
      what:
        description: "ask (the prompts against Groq) | live (the deployed Worker's /ask) | gemini (the Gemini keys) | shape (the keys' form and whether each answers now) | models (which models take a YouTube link) | yt (the deployed Worker's /yt, end to end)"
        default: live
      video:
        description: "a YouTube id for the probes that take one (optional)"
        default: ""
      to:
        description: "the end of the window in seconds, for ytmodels (optional)"
        default: ""
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: probe
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PROBE: ${{ inputs.what || 'none' }}
          PROBE_VIDEO_IN: ${{ inputs.video }}
          PROBE_TO_IN: ${{ inputs.to }}
          LIVE_WORKER: https://athar-asr.athar-7399079d.workers.dev
          LIVE_ORIGIN: https://athar-ledger.pages.dev
        run: |
          case "$PROBE_VIDEO_IN" in ''|*[!A-Za-z0-9_-]*) ;; *) export PROBE_VIDEO="$PROBE_VIDEO_IN" ;; esac
          case "$PROBE_TO_IN" in ''|*[!0-9]*) ;; *) export PROBE_TO="$PROBE_TO_IN" ;; esac
          if [ "$PROBE" = "gemini" ]; then node eval/keyprobe/run.mjs > /dev/null; fi
          if [ "$PROBE" = "ask" ]; then node eval/keyprobe/ask.mjs > /dev/null; fi
          if [ "$PROBE" = "chat2" ]; then node eval/keyprobe/chat2.mjs > /dev/null; fi
          if [ "$PROBE" = "live" ]; then node eval/keyprobe/live.mjs > /dev/null; fi
          if [ "$PROBE" = "shape" ]; then node eval/keyprobe/shape.mjs > /dev/null; fi
          if [ "$PROBE" = "models" ]; then node eval/keyprobe/models.mjs > /dev/null; fi
          if [ "$PROBE" = "ytmodels" ]; then node eval/keyprobe/ytmodels.mjs > /dev/null; fi
          if [ "$PROBE" = "ytstream" ]; then node eval/keyprobe/ytstream.mjs > /dev/null; fi
          if [ "$PROBE" = "yt" ]; then node eval/keyprobe/yt.mjs > /dev/null; fi
          if [ "$PROBE" = "ytlong" ]; then ONLY_LONGER=1 node eval/keyprobe/yt.mjs > /dev/null; fi
      - name: publish results
        if: always()
        run: |
          set -e
          mkdir -p /tmp/out && cp -r eval/keyprobe/out/. /tmp/out/ 2>/dev/null || echo '{"error":"no result"}' > /tmp/out/result.json
          git config user.name "key-probe"
          git config user.email "key-probe@users.noreply.github.com"
          git checkout --orphan key-probe-results
          git rm -rfq --cached .
          rm -rf keyprobe && mkdir keyprobe && cp -r /tmp/out/. keyprobe/
          echo "${GITHUB_SHA}" > keyprobe/COMMIT
          git add -f keyprobe
          git commit -qm "key probe for ${GITHUB_SHA}"
          git push -f origin key-probe-results
