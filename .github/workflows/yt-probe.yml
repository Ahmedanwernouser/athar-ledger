# Live end-to-end check of "a YouTube video from its link" (client code + Worker code + real Gemini + engine).
# Keys are repository secrets; never printed, never written. Results go to the branch `yt-probe-results`.
name: yt-probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["eval/yt/**", ".github/workflows/yt-probe.yml"]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: probe
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          LIVE_WORKER: https://athar-asr.athar-7399079d.workers.dev
          LIVE_ORIGIN: https://athar-ledger.pages.dev
        run: node eval/yt/run.mjs
      - name: publish results
        if: always()
        run: |
          set -e
          cp -r eval/yt/out-yt /tmp/out
          git config user.name "yt-probe"
          git config user.email "yt-probe@users.noreply.github.com"
          git checkout --orphan yt-probe-results
          git rm -rfq --cached .
          rm -rf yt && mkdir yt && cp -r /tmp/out/. yt/
          echo "${GITHUB_SHA}" > yt/COMMIT
          git add -f yt
          git commit -qm "yt probe for ${GITHUB_SHA}"
          git push -f origin yt-probe-results
