# Sentence vectors of the core library, by the model bge-m3 on Cloudflare Workers AI, asked through the deployed Worker as the
# site asks it (no secret). Resumable: the state lives on the branch `sem-data`; when the day's free allowance runs out the
# run stops cleanly and the next one (a push to these files or a manual start) goes on from there.
name: sem-build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/build_sem.mjs", "tools/embed_client.mjs", ".github/workflows/sem-build.yml"]
permissions:
  contents: write
concurrency:
  group: sem-build
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: the state so far
        run: |
          git config user.name "sem-build"
          git config user.email "sem-build@users.noreply.github.com"
          if git fetch -q origin sem-data:sem-data 2>/dev/null; then git worktree add -q /tmp/sem sem-data
          else git worktree add -q --detach /tmp/sem && cd /tmp/sem && git checkout -q --orphan sem-data && git rm -rfq . ; fi
          ls /tmp/sem | head -40
      - name: build
        env:
          LIVE_WORKER: https://athar-asr.athar-7399079d.workers.dev
          LIVE_ORIGIN: https://athar-ledger.pages.dev
        run: |
          if [ -f /tmp/sem/complete ]; then echo "already complete"; else node tools/build_sem.mjs /tmp/sem; fi
      - name: keep the state
        if: always()
        run: |
          cd /tmp/sem
          git add -A
          git diff --cached --quiet || { git commit -qm "sentence vectors: state after ${GITHUB_SHA}"; git push -q origin sem-data; }
